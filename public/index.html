<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscrição — Evento</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #7c3aed;
      --primary-light: #8b5cf6;
      --primary-dark: #6d28d9;
      --accent: #f59e0b;
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #222240;
      --text: #f1f1f8;
      --text-muted: #9ca3af;
      --border: #2d2d50;
      --success: #10b981;
      --error: #ef4444;
      --radius: 16px;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* HERO BANNER */
    .hero {
      width: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      padding: 60px 24px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(124,58,237,.35) 0%, transparent 70%);
    }
    .hero-content { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; }
    .hero-badge {
      display: inline-block;
      background: rgba(124,58,237,.25);
      border: 1px solid rgba(124,58,237,.5);
      color: #c4b5fd;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 100px;
      margin-bottom: 20px;
    }
    .hero h1 {
      font-size: clamp(28px, 6vw, 48px);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -1px;
      margin-bottom: 16px;
    }
    .hero h1 span { color: var(--primary-light); }

    .event-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 24px;
    }
    .meta-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      padding: 8px 16px;
      border-radius: 100px;
      font-size: 14px;
    }
    .meta-chip svg { opacity: .7; flex-shrink: 0; }

    .price-tag {
      margin-top: 28px;
      font-size: 36px;
      font-weight: 800;
      color: var(--accent);
    }
    .price-tag small { font-size: 16px; font-weight: 400; color: var(--text-muted); }

    /* FORM CONTAINER */
    .container {
      width: 100%;
      max-width: 480px;
      padding: 32px 24px 48px;
    }

    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }
    .form-card h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .form-card p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #d1d5db;
      margin-bottom: 8px;
      letter-spacing: .3px;
    }
    label span { color: var(--error); margin-left: 2px; }
    input {
      width: 100%;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 15px;
      color: var(--text);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input::placeholder { color: #4b5563; }
    input:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(124,58,237,.2);
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 8px;
      transition: transform .15s, box-shadow .15s, opacity .15s;
      box-shadow: 0 4px 20px rgba(124,58,237,.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(124,58,237,.5); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    .btn-submit .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .secure-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ALERT */
    .alert {
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }
    .alert.error { background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.3); color: #fca5a5; }
    .alert.success { background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.3); color: #6ee7b7; }
    .alert.show { display: block; }

    /* MODAL REDIRECT */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .overlay.show { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 32px;
      max-width: 380px;
      text-align: center;
    }
    .modal-icon { font-size: 56px; margin-bottom: 16px; }
    .modal h3 { font-size: 20px; margin-bottom: 10px; }
    .modal p { color: var(--text-muted); font-size: 14px; line-height: 1.6; }
    .modal .progress {
      height: 4px;
      background: var(--border);
      border-radius: 100px;
      margin-top: 24px;
      overflow: hidden;
    }
    .modal .progress-bar {
      height: 100%;
      background: var(--primary-light);
      border-radius: 100px;
      animation: progress 3s linear forwards;
    }
    @keyframes progress { from { width: 0% } to { width: 100% } }
  </style>
</head>
<body>

  <!-- HERO -->
  <div class="hero">
    <div class="hero-content">
      <div class="hero-badge">🎉 Inscrições Abertas</div>
      <h1 id="hero-title">Carregando <span>evento</span>…</h1>
      <div class="event-meta" id="event-meta"></div>
      <div class="price-tag" id="price-tag"></div>
    </div>
  </div>

  <!-- FORMULÁRIO -->
  <div class="container">
    <div class="form-card">
      <h2>Garantir minha vaga</h2>
      <p>Preencha seus dados para avançar ao pagamento seguro.</p>

      <div class="alert error" id="alert-error"></div>
      <div class="alert success" id="alert-success"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="nome">Nome completo <span>*</span></label>
          <input type="text" id="nome" name="nome" placeholder="Ex: João da Silva" autocomplete="name" required />
        </div>
        <div class="form-group">
          <label for="cpf">CPF <span>*</span></label>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" required />
        </div>
        <div class="form-group">
          <label for="rg">RG <span>*</span></label>
          <input type="text" id="rg" name="rg" placeholder="00.000.000-0" maxlength="12" required />
        </div>

        <button type="submit" class="btn-submit" id="btn-submit">
          <span class="spinner" id="spinner"></span>
          <span id="btn-text">Pagar e confirmar presença</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
        <div class="secure-note">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
          Pagamento processado com segurança pelo Mercado Pago
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL DE REDIRECIONAMENTO -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modal-icon">💳</div>
      <h3>Redirecionando para o pagamento</h3>
      <p>Você será levado ao Mercado Pago para finalizar o pagamento de forma segura.</p>
      <div class="progress"><div class="progress-bar"></div></div>
    </div>
  </div>

  <script>
    // ---- Carrega dados do evento ----
    async function loadEvent() {
      try {
        const r = await fetch('/api/event');
        const ev = await r.json();

        document.title = `Inscrição — ${ev.nome}`;
        document.getElementById('hero-title').innerHTML =
          `${ev.nome.split(' ').slice(0, -1).join(' ')} <span>${ev.nome.split(' ').pop()}</span>`;

        const meta = document.getElementById('event-meta');
        if (ev.data) {
          const d = new Date(ev.data + 'T00:00:00');
          meta.innerHTML += `<div class="meta-chip">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            ${d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' })}
          </div>`;
        }
        if (ev.local) {
          meta.innerHTML += `<div class="meta-chip">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
            </svg>
            ${ev.local}
          </div>`;
        }

        document.getElementById('price-tag').innerHTML =
          `R$ ${parseFloat(ev.preco).toFixed(2).replace('.', ',')} <small>por pessoa</small>`;
      } catch (e) {
        console.error(e);
      }
    }

    // ---- Máscara CPF ----
    document.getElementById('cpf').addEventListener('input', function () {
      let v = this.value.replace(/\D/g, '').substring(0, 11);
      v = v.replace(/(\d{3})(\d)/, '$1.$2')
           .replace(/(\d{3})\.(\d{3})(\d)/, '$1.$2.$3')
           .replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3-$4');
      this.value = v;
    });

    // ---- Submit ----
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btn-text');
      const alertError = document.getElementById('alert-error');
      const alertSuccess = document.getElementById('alert-success');

      alertError.classList.remove('show');
      alertSuccess.classList.remove('show');

      const nome = document.getElementById('nome').value.trim();
      const cpf = document.getElementById('cpf').value.trim();
      const rg = document.getElementById('rg').value.trim();

      if (!nome || !cpf || !rg) {
        alertError.textContent = 'Por favor, preencha todos os campos.';
        alertError.classList.add('show');
        return;
      }

      btn.disabled = true;
      spinner.style.display = 'block';
      btnText.textContent = 'Processando…';

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, cpf, rg }),
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Erro desconhecido.');

        if (data.already_registered) {
          alertSuccess.textContent = 'CPF já inscrito! Você será redirecionado ao seu bilhete.';
          alertSuccess.classList.add('show');
          setTimeout(() => { window.location.href = data.ticket_url; }, 2000);
          return;
        }

        // Redireciona para pagamento
        document.getElementById('overlay').classList.add('show');
        const url = data.payment_url;
        setTimeout(() => { window.location.href = url; }, 3000);
      } catch (err) {
        alertError.textContent = err.message || 'Erro ao processar. Tente novamente.';
        alertError.classList.add('show');
        btn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Pagar e confirmar presença';
      }
    });

    loadEvent();

    // Aviso de erro de pagamento via URL
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('erro') === 'pagamento_cancelado') {
      const el = document.getElementById('alert-error');
      el.textContent = 'Pagamento cancelado ou não aprovado. Tente novamente.';
      el.classList.add('show');
    }
  </script>
</body>
</html>
